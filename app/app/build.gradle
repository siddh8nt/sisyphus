plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sisyphus.worker'
    compileSdk 34

    defaultConfig {
        applicationId "com.sisyphus.worker"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "3.1"

        // Prefilled defaults for the setup screen. Windows hotspot gateway is
        // 192.168.137.1; the orchestrator serves the worker view on :4100.
        buildConfigField "String", "DEFAULT_HUB_IP", "\"192.168.137.1\""
        buildConfigField "int", "DEFAULT_PORT", "4100"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Keep the same app id so re-installs replace cleanly on the demo phone.
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Name the built APK directly (no post-build copy/rename).
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "worker view v3.apk"
        }
    }
}

// No external dependencies: framework Activity + WebView only, so the build
// resolves fully offline against the local Gradle cache.
dependencies {
}
